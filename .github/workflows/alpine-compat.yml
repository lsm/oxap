name: Alpine harness compatibility

on:
  push:
    branches: [codex/alpine-image]
  pull_request:
    paths:
      - .github/workflows/alpine-compat.yml
      - Dockerfile
      - .claude/skills/verify/**

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - name: Check the pinned harness on Alpine
        run: |
          docker run --rm --platform linux/amd64 alpine:3.22 sh -euxc '
            apk add --no-cache ca-certificates curl gcompat
            curl -fsSL https://opencode.ai/files/bin/2.2.7/opencode-linux-x64.tar.gz -o /tmp/harness.tar.gz
            echo "89a6cee227b54bc011179c528a5e63176032462b1a5e21723b616801cddc2ca7  /tmp/harness.tar.gz" | sha256sum -c -
            tar -xzf /tmp/harness.tar.gz -C /tmp
            echo "589253d36810f21217edd51545cd435b328cdc3cf4f451fbe0cce6f88afcf5e1  /tmp/opencode" | sha256sum -c -
            /tmp/opencode --version
          '
