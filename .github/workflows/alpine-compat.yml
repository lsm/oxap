name: Alpine image

on:
  push:
    branches: [codex/alpine-image]
  pull_request:
    paths:
      - Dockerfile
      - zig/**
      - schema/**
      - harnesses/**
      - .claude/skills/verify/**
      - .github/workflows/alpine-compat.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build runner
        run: zig build --build-file zig/build.zig -Dtarget=x86_64-linux -Doptimize=ReleaseSafe
      - name: Build image
        run: docker build --platform linux/amd64 -t oxap-alpine:verify .
      - name: Run image journey
        run: NODE_ENV=test python3 .claude/skills/verify/scripts/alpine-image.py "$RUNNER_TEMP/alpine-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpine-evidence
          path: ${{ runner.temp }}/alpine-evidence
