[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oxap"
version = "0.1.0a46"
description = "OXAP for Python: installs oxap-sdk, the Python SDK for the oxap runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "ISC" }
authors = [{ name = "Open Agent Protocol contributors" }]
dependencies = ["oxap-sdk==0.1.0a46"]

[project.urls]
Homepage = "https://github.com/lsm/oxap"
Source = "https://github.com/lsm/oxap/tree/main/sdk/python-oxap"

[tool.hatch.build.targets.wheel]
bypass-selection = true
